name: Build Extension

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build popup (Vite)
        run: npm run build

      - name: Build inject content script (esbuild)
        run: |
          npx esbuild src/content/inject.js \
            --bundle \
            --outfile=inject.js \
            --format=iife \
            --platform=browser \
            --external:chrome
          echo "inject.js size: $(wc -c < inject.js) bytes"

      - name: Build service worker (esbuild)
        run: |
          npx esbuild src/background/service-worker.js \
            --bundle \
            --outfile=service-worker.js \
            --format=esm \
            --platform=browser \
            --external:chrome
          echo "service-worker.js size: $(wc -c < service-worker.js) bytes"

      - name: Show all files
        run: |
          echo "=== root files ===" && ls -la *.js *.json
          echo "=== dist files ===" && find dist -type f | sort

      - name: Package extension
        run: |
          mkdir -p package
          cp manifest.json package/
          cp inject.js package/
          cp service-worker.js package/
          cp -r dist package/
          cd package && zip -r ../radiant-extension.zip .
          echo "=== ZIP contents ===" && unzip -l ../radiant-extension.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: radiant-extension
          path: radiant-extension.zip
