name: Build Extension

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Verify dist HTML output
        run: |
          echo "--- HTML files in dist ---"
          find dist -name "*.html"
          echo "--- manifest.json popup path ---"
          cat manifest.json | grep popup

      - name: Package extension
        run: |
          mkdir -p extension-package
          cp manifest.json extension-package/
          cp -r dist extension-package/
          cp -r icons extension-package/ 2>/dev/null || echo "No icons folder found, skipping"
          cd extension-package && zip -r ../radiant-extension.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: radiant-extension
          path: radiant-extension.zip
