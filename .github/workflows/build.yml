name: Build Extension

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build extension
        run: npm run build

      - name: Copy manifest and icons to dist
        run: |
          cp manifest.json dist/
          mkdir -p dist/icons
          cp -r public/icons/* dist/icons/
          ls -la dist/

      - name: Create ZIP
        run: |
          cd dist
          zip -r ../radiant-wallet-extension.zip .
          cd ..
          echo "ZIP contents:"
          unzip -l radiant-wallet-extension.zip | head -20

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: radiant-wallet-extension
          path: radiant-wallet-extension.zip
          retention-days: 30
