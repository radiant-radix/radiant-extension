name: Build Extension

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build popup (Vite)
        run: npm run build

      - name: Build inject content script (esbuild)
        run: |
          npx esbuild src/content/inject.js \
            --bundle \
            --outfile=dist/inject.js \
            --format=iife \
            --platform=browser \
            --external:chrome
          echo "inject.js built successfully"

      - name: Update manifest with content_scripts
        run: |
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('manifest.json'));
            m.content_scripts = [{
              matches: ['http://*/*','https://*/*'],
              js: ['dist/inject.js'],
              run_at: 'document_start',
              all_frames: false
            }];
            m.host_permissions = ['http://*/*','https://*/*'];
            fs.writeFileSync('manifest.json', JSON.stringify(m, null, 2));
            console.log('manifest updated');
            console.log(JSON.stringify(m, null, 2));
          "

      - name: Show dist structure
        run: find dist -type f | sort

      - name: Show built index.html
        run: cat dist/index.html

      - name: Package extension
        run: |
          mkdir -p package
          cp manifest.json package/
          cp -r dist package/
          cd package && zip -r ../radiant-extension.zip .
          unzip -l ../radiant-extension.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: radiant-extension
          path: radiant-extension.zip
