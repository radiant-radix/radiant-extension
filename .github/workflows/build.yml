name: Build Extension

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Show dist structure
        run: find dist -type f | sort

      - name: Package extension
        run: |
          mkdir -p package
          cp manifest.json package/
          cp -r dist package/
          cp -r icons package/ 2>/dev/null || echo "No icons folder"
          cp -r public/icons package/ 2>/dev/null || echo "No public/icons folder"
          cd package && zip -r ../radiant-extension.zip .
          echo "--- ZIP contents ---"
          unzip -l ../radiant-extension.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: radiant-extension
          path: radiant-extension.zip
